[project]
name = "enywheria"
version = "0.1.0"
description = "Personal Knowledge & Asset System (PersonalVault)"
authors = [
    { name = "greg", email = "fealx15@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "cryptography>=42.0.5",
    "rapidfuzz>=3.6.2",
    "loguru>=0.7.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
]

[project.scripts]
enywheria-relay = "app.p2p.cli:run_relay"
enywheria-p2p = "app.p2p.cli:run_node"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
    "black>=24.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
