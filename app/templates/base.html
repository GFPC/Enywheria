<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "PersonalVault" }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Top Navigation Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⚡</span>
                <span class="font-bold text-xl tracking-tight text-indigo-400">PersonalVault</span>
                <span class="text-xs bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700">v0.1.0</span>
            </div>

            <!-- Instant Search Bar -->
            <div class="relative w-1/3" x-data="{ query: '', suggestions: [] }">
                <input 
                    type="text" 
                    placeholder="Search files, notes, scripts..." 
                    x-model="query"
                    @input.debounce.300ms="
                        if(query.length >= 2) {
                            fetch('/api/v1/search/suggest?q=' + encodeURIComponent(query))
                                .then(r => r.json())
                                .then(d => suggestions = d.suggestions)
                        } else { suggestions = [] }
                    "
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                >
                <div 
                    x-show="suggestions.length > 0" 
                    @click.away="suggestions = []"
                    class="absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl overflow-hidden z-50 max-h-60 overflow-y-auto"
                >
                    <template x-for="item in suggestions" :key="item.id">
                        <div class="px-4 py-2.5 hover:bg-slate-700 cursor-pointer flex items-center justify-between text-sm">
                            <span class="text-slate-200" x-text="item.text"></span>
                            <span class="text-xs text-indigo-400 uppercase tracking-wider" x-text="item.entity_type"></span>
                        </div>
                    </template>
                </div>
            </div>

            <nav class="flex items-center space-x-6 text-sm">
                <a href="/" class="hover:text-indigo-400 transition font-medium">Dashboard</a>
                <a href="/docs" target="_blank" class="hover:text-indigo-400 transition text-slate-400">API Specs</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Personal Knowledge & Asset System — Local SQLite & Sharded Storage
    </footer>
</body>
</html>
